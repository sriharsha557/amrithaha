<svg width="1000" height="1240" viewBox="0 0 1000 1240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FB65A"/>
      <stop offset="1" stop-color="#1F7A3D"/>
    </linearGradient>
    <linearGradient id="deepGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8B4E"/>
      <stop offset="1" stop-color="#17552C"/>
    </linearGradient>
    <linearGradient id="creamBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF6"/>
      <stop offset="1" stop-color="#F3F0E6"/>
    </linearGradient>
    <style>
      .word   { font-family: 'Georgia','Times New Roman',serif; font-weight:700; }
      .sans   { font-family: 'Trebuchet MS','Segoe UI',sans-serif; }
      .tel    { font-family: 'Nirmala UI','Gautami','Noto Sans Telugu',sans-serif; }
    </style>

    <!-- Reusable mark: leaf + nectar droplet -->
    <g id="mark">
      <!-- droplet / leaf body -->
      <path d="M60 6 C 92 44, 108 76, 108 100 A48 48 0 1 1 12 100 C 12 76, 28 44, 60 6 Z"
            fill="url(#leafGrad)"/>
      <!-- leaf midrib highlight -->
      <path d="M60 34 C 46 60, 40 92, 60 132" fill="none" stroke="#EAF7E9" stroke-width="5"
            stroke-linecap="round" opacity="0.85"/>
      <!-- little side veins -->
      <path d="M60 66 C 70 70, 78 76, 82 86 M60 92 C 70 96, 77 102, 80 112"
            fill="none" stroke="#EAF7E9" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <!-- sprout dot -->
      <circle cx="60" cy="18" r="7" fill="#F2C14E"/>
    </g>
  </defs>

  <rect width="1000" height="1240" fill="url(#creamBg)"/>

  <!-- ================= VARIANT A — EMBLEM / BADGE ================= -->
  <text x="70" y="70" class="sans" font-size="20" letter-spacing="3" fill="#8A8A7A">PRIMARY · EMBLEM</text>

  <g transform="translate(500 300)">
    <circle r="185" fill="#FFFFFF" stroke="url(#deepGreen)" stroke-width="10"/>
    <circle r="163" fill="none" stroke="#DCEBDD" stroke-width="2"/>

    <!-- mark -->
    <g transform="translate(-60 -150) scale(1.0)">
      <use href="#mark"/>
    </g>

    <!-- wordmark -->
    <text x="0" y="45" text-anchor="middle" class="word" font-size="52"
          fill="#17552C" letter-spacing="1">Amrithaha</text>
    <!-- telugu -->
    <text x="0" y="90" text-anchor="middle" class="tel" font-size="36" fill="#2E8B4E">అమృతః</text>
  </g>

  <line x1="70" y1="540" x2="930" y2="540" stroke="#E3DFD1" stroke-width="2"/>

  <!-- ================= VARIANT B — HORIZONTAL LOCKUP ================= -->
  <text x="70" y="600" class="sans" font-size="20" letter-spacing="3" fill="#8A8A7A">HORIZONTAL · LOCKUP</text>

  <g transform="translate(150 640)">
    <!-- rounded tile with icon -->
    <rect x="0" y="0" width="150" height="150" rx="34" fill="url(#deepGreen)"/>
    <g transform="translate(15 8) scale(1.0)">
      <use href="#mark"/>
    </g>

    <!-- wordmark block -->
    <text x="185" y="70" class="word" font-size="66" fill="#17552C" letter-spacing="1">Amrithaha</text>
    <text x="188" y="112" class="tel" font-size="30" fill="#2E8B4E">అమృతః</text>
    <text x="188" y="140" class="sans" font-size="18" letter-spacing="5" fill="#9AA48C">
      HEALTHY · WHOLESOME · PURE</text>
  </g>

  <line x1="70" y1="860" x2="930" y2="860" stroke="#E3DFD1" stroke-width="2"/>

  <!-- ================= VARIANT C — MONOGRAM + REVERSED ================= -->
  <text x="70" y="920" class="sans" font-size="20" letter-spacing="3" fill="#8A8A7A">APP ICON · MONOGRAM</text>

  <!-- light monogram -->
  <g transform="translate(150 960)">
    <rect width="200" height="200" rx="46" fill="#FFFFFF" stroke="url(#deepGreen)" stroke-width="6"/>
    <g transform="translate(40 30) scale(1.05)">
      <use href="#mark"/>
    </g>
    <text x="100" y="185" text-anchor="middle" class="word" font-size="30" fill="#17552C">A</text>
  </g>

  <!-- dark monogram (reversed) -->
  <g transform="translate(410 960)">
    <rect width="200" height="200" rx="46" fill="url(#deepGreen)"/>
    <g transform="translate(40 30) scale(1.05)">
      <use href="#mark"/>
    </g>
    <text x="100" y="185" text-anchor="middle" class="word" font-size="30" fill="#EAF7E9">A</text>
  </g>

  <!-- palette swatches -->
  <g transform="translate(680 960)">
    <text x="0" y="-10" class="sans" font-size="18" letter-spacing="2" fill="#8A8A7A">PALETTE</text>
    <rect x="0"   y="10" width="46" height="46" rx="8" fill="#17552C"/>
    <rect x="58"  y="10" width="46" height="46" rx="8" fill="#2E8B4E"/>
    <rect x="116" y="10" width="46" height="46" rx="8" fill="#5FB65A"/>
    <rect x="0"   y="70" width="46" height="46" rx="8" fill="#F2C14E"/>
    <rect x="58"  y="70" width="46" height="46" rx="8" fill="#F3F0E6"/>
    <rect x="116" y="70" width="46" height="46" rx="8" fill="#FCFBF6" stroke="#DDD" stroke-width="1"/>

    <text x="0"   y="150" class="sans" font-size="12" fill="#666">#17552C</text>
    <text x="58"  y="150" class="sans" font-size="12" fill="#666">#2E8B4E</text>
    <text x="116" y="150" class="sans" font-size="12" fill="#666">#5FB65A</text>
    <text x="0"   y="176" class="sans" font-size="12" fill="#666">#F2C14E</text>
  </g>

</svg>
